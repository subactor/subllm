[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-subllm"
version = "1.14.0"
description = "Central provider, model and application routing policy for Subactor LLM consumers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Subactor"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
gateway = ["mcp==1.28.1", "uvicorn>=0.35,<1", "psycopg[binary]>=3.2,<4"]
cursor = [
  "cursor-sdk>=1.0.28,<2",
]
test = [
  "mcp==1.28.1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "build>=1.2,<2",
  "jsonschema==4.26.0",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
subllm = "subllm.cli:main"
subllm-code-edit = "subllm.client:code_edit_main"
subllm-complete = "subllm.client:completion_main"
subllm-mcp-proxy = "subllm.gateway_stdio:main"
subllm-gateway = "subllm.gateway:main"
subllm-proxy = "subllm.proxy:serve_proxy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subllm = ["py.typed", "code2dsl_bridge.mjs", "code2dsl_projection.mjs", "assets/*.html", "assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p wellmanifest_governance -ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"
