schema_version = 2

# Lower priority wins. Set enabled = false to remove a provider from every
# route. default_model is the logical model ID from src/subllm/policy.py.
# Credential strategies (ADOPT wellmanifest policy-dsl / env-dsl):
#   CURSOR_API_KEY     → cursor (cursor-sdk)     → gpt-5.6-sol (then grok-4.6)
#   ZAI_API_KEY        → zai                    → glm-5.2
#   OPENROUTER_API_KEY → openrouter             → glm-5.2 (+ route extras)
# Cursor Sol / Grok are never OpenRouter wire ids.
[providers.cursor]
enabled = true
priority = 0
default_model = "gpt-5.6-sol"

[providers.zai]
enabled = true
priority = 10
default_model = "glm-5.2"

[providers.openrouter]
enabled = true
priority = 20
default_model = "glm-5.2"

# The table key is the stable application ID sent as user/user_id. name is the
# display name used by OpenRouter; url is its attribution identifier.
[applications.doctor-agent]
name = "doctor-agent"
url = "https://github.com/subactor/doctor-agent"

[applications.repair-agent]
name = "repair-agent"
url = "https://github.com/subactor/repair-agent"

[applications.validator-agent]
name = "validator-agent"
url = "https://github.com/subactor/validator-agent"

[applications.skills-agent]
name = "skills-agent"
url = "https://github.com/subactor/skills-agent"

[applications.onedev-agent]
name = "onedev-agent"
url = "https://github.com/subactor/onedev-agent"

[applications.todo2code]
name = "todo2code"
url = "https://github.com/semcod/todo2code"

[applications.koru-agent]
name = "Koru"
url = "https://github.com/semcod/koru"

[applications.platform]
name = "Subactor Platform"
url = "https://github.com/subactor/platform"

[applications.szeptnik-one]
name = "Szeptnik One"
url = "https://github.com/tom-sapletta-com/watch"

[applications.supervisor]
name = "Subactor Supervisor"
url = "https://github.com/subactor/supervisor"

