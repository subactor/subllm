schema_version = 3

# Runtime failover is sequential: it never starts duplicate speculative calls.
# timeout_seconds passed to complete() is the total caller budget; each provider
# attempt receives at most attempt_timeout_seconds from that remaining budget.
#
# The budget has to fit a reasoning model on an agent-sized prompt, not an HTTP
# round trip. Measured 2026-09-16 on the 17 076-character koru queue prompt
# (4191 input tokens): z.ai glm-5.3 answered in 4.86 s with max_tokens=4096 and
# 8.92 s without one. A 12 s cap with a 10 s slow threshold therefore called the
# normal case slow and failed on ordinary variance, and every candidate on
# koru-agent/queue-executor reported timeout while the providers were healthy.
# At max_attempts = 6 the worst case stays a fraction of a caller budget that
# koru sets to 1800 s.
[execution]
failover_enabled = true
attempt_timeout_seconds = 90.0
slow_response_seconds = 45.0
cooldown_seconds = 60.0
failure_threshold = 1
max_attempts = 6

# Lower priority wins. Set enabled = false to remove a provider from every
# route. default_model is the logical model ID from src/subllm/policy.py.
# Credential strategies (ADOPT wellmanifest policy-dsl / env-dsl):
#   ZAI_API_KEY        → zai                    → glm-5.3
#   GEMINI_API_KEY     → agy (gemini-sdk)       → gemini-3.8-flash
#   OPENAI_API_KEY     → codex                  → gpt-6-sol
#   ANTHROPIC_API_KEY  → claude                 → claude-opus-5
#   CURSOR_API_KEY     → cursor (cursor-sdk)     → gpt-5.6-sol
#   OPENROUTER_API_KEY → openrouter             → role-specific GLM 5.3 fallbacks
#   (no key)           → minis (custom, tunnel) → qwen3:8b
#   OLLAMA_API_KEY     → ollama                 → qwen3-coder:30b
# Direct-provider model IDs are not inferred to be OpenRouter wire IDs.
[providers.zai]
enabled = true
priority = 0
default_model = "glm-5.3"

[providers.agy]
enabled = true
priority = 10
default_model = "gemini-3.8-flash"

[providers.codex-cli]
enabled = true
priority = 16
default_model = "gpt-6-sol"

[providers.codex]
enabled = true
priority = 15
default_model = "gpt-6-sol"

[providers.claude]
enabled = true
priority = 18
default_model = "claude-opus-5"

# Disabled 2026-09-18: 1528 consecutive failures (reason=provider_unavailable)
# across _DEFAULT, _REPAIR, _VALIDATOR, _CODING, and _CODE_CONTEXT routes.
[providers.cursor]
enabled = false
priority = 20
default_model = "gpt-5.6-sol"

# Cloud providers first; a provider without credentials is skipped. Local
# models are the last resort: the LAN host minis, then the proxy host's Ollama.
[providers.openrouter]
enabled = true
priority = 30
default_model = "glm-5.3-flash"

[providers.ollama]
enabled = true
priority = 210
default_model = "qwen3-coder:30b"

# Ollama on the LAN host minis (16 GB). Remote endpoints must be HTTPS, so it
# is reached through the loopback SSH tunnel kept up on the proxy host by the
# user unit minis-ollama-tunnel.service:
#   ssh -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
#       -L 127.0.0.1:11439:127.0.0.1:11434 minis
# (11435/11436 are SubLLM proxy listeners, not Ollama.)
# Without the tunnel the attempt fails fast and the next candidate is used.
# routes mirrors every route whose built-in chain already includes ollama.
[custom_providers.minis]
api_base = "http://127.0.0.1:11439/v1"
api_key_env = "OLLAMA_API_KEY"
default_model = "qwen3:8b"
priority = 200
routes = [
  "autogrammar-curllm",
  "autogrammar-doql",
  "autogrammar-gillm",
  "autogrammar-hillm",
  "autogrammar-imgl/generate",
  "autogrammar-intract",
  "autogrammar-nexu/cinema",
  "autogrammar-nexu/generate",
  "autogrammar-nlp2cmd/extract-schema",
  "autogrammar-nlp2cmd/generate",
  "autogrammar-nlp2dsl",
  "autogrammar-redsl",
  "autogrammar-testql",
  "autogrammar-tillm",
  "autogrammar-toonic",
  "autogrammar-vql/generate",
  "c2004-system",
  "doctor-agent",
  "koru-agent",
  "onedev-agent",
  "platform",
  "prellm",
  "premesh",
  "repair-agent",
  "semcod-algitex",
  "semcod-code2docs",
  "semcod-code2logic",
  "semcod-docval",
  "semcod-fixos",
  "semcod-nfo",
  "semcod-pfix",
  "semcod-planfile",
  "semcod-taskill",
  "semcod-vallm",
  "skills-agent",
  "subactor-proxy/chat",
  "subactor-proxy/completion",
  "supervisor",
  "todo2code",
  "twinstudio",
  "validator-agent",
  "wellman",
]

